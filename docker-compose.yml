version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: quiz-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Quiz@DB2026}
      MYSQL_DATABASE: quiz_db
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: ${TZ:-UTC}
    volumes:
      - quiz-mysql-data:/var/lib/mysql
      # 初始化脚本（可选）
      # - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    networks:
      - quiz-network
    command: 
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quiz-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Quiz@DB2026}
      DB_NAME: quiz_db
      PORT: 3000
      NODE_ENV: production
      TZ: ${TZ:-UTC}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - quiz-network
    volumes:
      - quiz-backend-data:/app/data
      - quiz-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/exams"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_ADMIN_PASSWORD: ${VITE_ADMIN_PASSWORD:-Admin@Quiz2026}
    container_name: quiz-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - quiz-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Ngrok 服务 (已禁用，使用 DDNS 方式部署)
  # ngrok:
  #   image: ngrok/ngrok:latest
  #   container_name: quiz-ngrok
  #   restart: always
  #   environment:
  #     NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
  #   command: http frontend:80
  #   ports:
  #     - "4040:4040"
  #   networks:
  #     - quiz-network
  #   depends_on:
  #     - frontend

  # Cloudflare Tunnel 服务 (已禁用，如果需要请取消注释并注释掉 ngrok)
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: quiz-cloudflared
  #   restart: always
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
  #   networks:
  #     - quiz-network
  #   depends_on:
  #     - frontend
  #     - backend
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

networks:
  quiz-network:
    driver: bridge

volumes:
  quiz-mysql-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      # 请根据你的服务器环境修改此路径
      # 示例路径:
      # - Ubuntu/Debian: /data/quiz/mysql
      # - Synology NAS: /volume1/docker/quiz/mysql
      # - 其他: /your/custom/path/mysql
      device: /volume1/docker/quiz/mysql
  quiz-backend-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      # 请根据你的服务器环境修改此路径
      device: /volume1/docker/quiz/backend
  quiz-uploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      # 请根据你的服务器环境修改此路径
      device: /volume1/docker/quiz/uploads
